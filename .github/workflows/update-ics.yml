name: Update ICS

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dynamic calendar as static ICS
        run: |
          SOURCE_URL="https://plasterlodzki.pl/wydarzenia/category/koncert/list/?ical=1"
      
          curl -L \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            -A "Mozilla/5.0" \
            -H "Accept: text/calendar,*/*;q=0.8" \
            "$SOURCE_URL" \
            -o events.ics
      
          echo "Downloaded file size:"
          wc -c events.ics
      
          echo "First 30 lines of downloaded file:"
          head -n 30 events.ics
      
          echo "Checking ICS markers..."
          test -s events.ics
          grep -q "BEGIN:VCALENDAR" events.ics
          grep -q "END:VCALENDAR" events.ics

      - name: Add nojekyll marker
        run: |
          touch .nojekyll

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add events.ics .nojekyll
          git diff --cached --quiet || git commit -m "Update events.ics"
          git push
