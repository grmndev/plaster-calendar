name: Update ICS

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dynamic calendar as static ICS
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://plasterlodzki.pl/?post_type=tribe_events&tribe_events_cat=koncert&ical=1&eventDisplay=list" \
            -o events.ics

          test -s events.ics
          grep -q "BEGIN:VCALENDAR" events.ics
          grep -q "END:VCALENDAR" events.ics

      - name: Add nojekyll marker
        run: |
          touch .nojekyll

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add events.ics .nojekyll
          git diff --cached --quiet || git commit -m "Update events.ics"
          git push
