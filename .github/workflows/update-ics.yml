name: Update ICS

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose ICS download
        run: |
          SOURCE_URL="https://plasterlodzki.pl/wydarzenia/category/koncert/list/?ical=1"
      
          set +e
      
          curl -L \
            --silent \
            --show-error \
            --compressed \
            --http1.1 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/calendar,application/calendar,text/plain,*/*;q=0.8" \
            -H "Accept-Language: pl-PL,pl;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Referer: https://plasterlodzki.pl/wydarzenia/category/koncert/list/" \
            -D headers.txt \
            "$SOURCE_URL" \
            -o events.ics
      
          CURL_EXIT=$?
      
          echo "curl exit code: $CURL_EXIT"
      
          echo "===== Response headers ====="
          cat headers.txt || true
      
          echo "===== Downloaded file size ====="
          wc -c events.ics || true
      
          echo "===== First 80 lines of downloaded file ====="
          head -n 80 events.ics || true
      
          echo "===== ICS validation ====="
          grep -q "BEGIN:VCALENDAR" events.ics && echo "BEGIN:VCALENDAR found" || echo "BEGIN:VCALENDAR NOT found"
          grep -q "END:VCALENDAR" events.ics && echo "END:VCALENDAR found" || echo "END:VCALENDAR NOT found"
      
          test -s events.ics
          grep -q "BEGIN:VCALENDAR" events.ics
          grep -q "END:VCALENDAR" events.ics

      - name: Add nojekyll marker
        run: |
          touch .nojekyll

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add events.ics .nojekyll
          git diff --cached --quiet || git commit -m "Update events.ics"
          git push
